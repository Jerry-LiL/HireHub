services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hirehub
      POSTGRES_PASSWORD: hirehub
      POSTGRES_DB: hirehub
    ports:
      - "5432:5432"
    volumes:
      - hirehub-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirehub -d hirehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hirehub-data:
